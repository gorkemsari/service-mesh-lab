# sml-data: Postgres ve Redis. Yalnızca sml-app (ingress-nginx TCP portları üzerinden) ulaşır.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: 10.40.0.0/16
  serviceSubnet: 10.41.0.0/16
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
      smlab.io/zone: data
